[package]
name = "rule"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "gzip"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde_json = { workspace = true }
serde_json_path = { version = "0.7.2", default-features = false }
anyhow = { workspace = true }
scraper = { version = "0.27.0", default-features = false }
models = { path = "../models" }
roxmltree = { version = "0.21.1", default-features = false, features = ["std"] }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }

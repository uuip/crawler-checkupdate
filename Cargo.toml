[workspace]
members = [
    "impl_joinset",
    "impl_stream",
    "impl_channel",
    "impl_join",
    "impl_stream_dashmap",
    "rule",
    "models",
    "common",
]
resolver = "2"

[workspace.dependencies]
sea-orm = { version = "2.0.1", features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3.34"
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = 3 # 使性能好
#opt-level = "z" # 使二进制体积小
